<main>
  <style>
    /* Contenedor principal centrado */
    .contacto-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background-color: #f0fdf4; /* Fondo suave que combina con el verde */
    }

    /* Tarjeta blanca con sombra */
    .contacto-card {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        padding: 35px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        border-top: 10px solid #1a5e37; /* El verde de tu sitio */
    }

    .contacto-card h1 {
        color: #1a5e37;
        margin-bottom: 25px;
        font-size: 2.2rem;
    }

    /* Estilo de los enlaces principales (Teléfono y Email) */
    .info-link {
        display: flex;
        flex-direction: column;
        text-decoration: none;
        background: #f8faf9;
        margin-bottom: 12px;
        padding: 15px;
        border-radius: 12px;
        transition: all 0.3s ease;
        border: 1px solid #eee;
    }

    .info-link:hover {
        background: #e9f7ef;
        transform: translateY(-3px);
        border-color: #1a5e37;
    }

    .info-link span {
        font-weight: bold;
        color: #1a5e37;
        font-size: 0.8rem;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .info-link p {
        margin: 0;
        font-size: 1.1rem;
        color: #333;
    }

    /* SECCIÓN DE REDES SOCIALES */
    .redes-titulo {
        margin-top: 30px;
        font-size: 0.9rem;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    .redes-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 15px;
    }

    .btn-social {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        border-radius: 10px;
        text-decoration: none;
        color: white;
        font-size: 0.9rem;
        font-weight: 600;
        transition: opacity 0.3s;
    }

    .btn-social:hover { opacity: 0.85; }

    /* Colores oficiales de redes sociales */
    .fb { background-color: #1877F2; }
    .msgr { background-color: #0084FF; }
    .inst { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
    .wapp { background-color: #25D366; }

    /* CONTENEDOR DEL MAPA */
    .mapa-box {
        margin-top: 30px;
        border-radius: 15px;
        overflow: hidden;
        border: 2px solid #e9f7ef;
        height: 200px;
    }

    .mapa-box iframe {
        width: 100%;
        height: 100%;
        border: 0;
    }
</style>

<main class="contacto-wrapper">
    <section class="contacto-card">
        <h1>Contáctanos</h1>
        
        <a href="tel:55551234" class="info-link">
            <span>📞 Teléfono Directo</span>
            <p>5555-1234</p>
        </a>

        <a href="mailto:contacto@huellitas.com" class="info-link">
            <span>✉️ Correo Electrónico</span>
            <p>contacto@huellitas.com</p>
        </a>

        <p class="redes-titulo">Síguenos y Escríbenos</p>
        <div class="redes-grid">
            <a href="https://facebook.com" target="_blank" class="btn-social fb">Facebook</a>
            <a href="https://m.me/huellitas" target="_blank" class="btn-social msgr">Messenger</a>
            <a href="https://instagram.com" target="_blank" class="btn-social inst">Instagram</a>
            <a href="https://wa.me/50255551234" target="_blank" class="btn-social wapp">WhatsApp</a>
        </div>

       <div class="mapa-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15440.000000000002!2d-90.513!3d14.634!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8589a180655c3345%3A0x4a72c13152427ef0!2sGuatemala!5e0!3m2!1ses!2sgt!4v1700000000000" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>
    </section>
</main>

<footer>
    <p>Huellitas Felices</p>
</footer>

</body>
</html>
