    <meta charset="UTF-8">

<body>

<header>
    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="veterinarios.html">Veterinarios</a></li>

            <li><a href="tienda.html">Tienda</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="section">

        <h1>Agenda tu cita</h1>
        <p>Horario de atención: Lunes a Sábado de 8:00 a.m. a 6:00 p.m.</p>

        <form class="form-citas">
            <fieldset>
                <legend>Datos del Propietario y Mascota</legend>
                
                <label for="nombre-dueno">Nombre del Dueño:</label>
                <input type="text" id="nombre-dueno" name="nombre-dueno" required>

                <label for="nombre-mascota">Nombre de la Mascota:</label>
                <input type="text" id="nombre-mascota" name="nombre-mascota" required>
                
                <label for="edad-mascota">Edad de la Mascota:</label>
                <input type="number" id="edad-mascota" name="edad-mascota" min="0" required>


                <label for="fecha">Fecha de la Cita:</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="motivo">Motivo de la Cita:</label>
                <select id="motivo" name="motivo">
                    <option value="consulta">Consulta General</option>
                    <option value="vacuna">Vacunación</option>
                    <option value="estetica">Estética</option>
                    <option value="cirugia">Cirugía</option>
                </select>

                <label for="notas">Notas adicionales:</label>
                <textarea id="notas" name="notas" rows="3"></textarea>
            </fieldset>

            <button type="submit">Enviar Solicitud</button>
        </form>
    </section>
</main>

<footer>
    <p>Huellitas Felices - Angel Esteban García Jiménez 2025261</p>
</footer>

</body>
</html>
